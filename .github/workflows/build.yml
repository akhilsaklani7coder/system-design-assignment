name: C++ Build Check

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: g++ -std=c++17 -Wall -Wextra -pedantic main.cpp -o movie_booking
      - name: Smoke test
        run: printf '1\n0\n' | ./movie_booking
